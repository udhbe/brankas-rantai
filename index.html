<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brankas Rantai</title>
<style>
:root{
  --bg:#E8EEF0;--surface:#FFFFFF;--ink:#16212B;--muted:#566874;--line:#C7D2D8;
  --accent:#0B5563;--accent-ink:#FFFFFF;--panel:#0B3A44;--panel-ink:#E6FAF4;--panel-dim:#8CC4CC;
  --warn-bg:#FFF1CF;--warn-ink:#5E4300;--danger:#A3231B;--ok:#176B45;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0D1317;--surface:#151E24;--ink:#E3ECF0;--muted:#92A5B0;--line:#2A3943;
    --accent:#5CC6D6;--accent-ink:#04232A;--panel:#0A2B33;--panel-ink:#E6FAF4;--panel-dim:#7FB7C0;
    --warn-bg:#3A2D08;--warn-ink:#F3D98B;--danger:#FF8A80;--ok:#6FD7A5;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;font-size:16px}
main{max-width:720px;margin:0 auto;padding:12px 16px 64px}
main.enter{animation:enter .3s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1,h2{font-family:var(--serif);line-height:1.2;margin:0 0 10px}
h1{font-size:1.7rem}
h2{font-size:1.25rem}
p{margin:0 0 12px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0 16px}
.brand{font-family:var(--serif);font-size:1.2rem;font-weight:700}

.hero{background:var(--panel);color:var(--panel-ink);border-radius:14px;padding:20px;margin-bottom:16px}
.herotop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.hero .label{font-size:.9rem;color:var(--panel-dim);margin:0}
.coderow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.code{font-family:var(--mono);font-weight:600;font-size:clamp(1.3rem,6.2vw,2.2rem);letter-spacing:.04em;word-spacing:.3em;overflow-wrap:anywhere}
.code.flash{animation:flash 1s ease-out}
@keyframes flash{from{color:#fff;text-shadow:0 0 22px var(--panel-dim)}to{color:var(--panel-ink);text-shadow:none}}
.hero .hint{font-size:.9rem;color:var(--panel-dim);margin:0 0 6px}
.hero .alert{margin:12px 0 0;padding:10px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn-ink);font-size:.92rem}
.hero .btn{background:transparent;color:var(--panel-ink);border-color:var(--panel-dim);flex:none}

.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:.85rem;font-weight:600}
.badge.idle{background:rgba(255,255,255,.14);color:var(--panel-ink)}
.badge.ok{background:#1E7A52;color:#fff}
.badge.bad{background:#B3261E;color:#fff}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.note{padding:12px 14px;border-radius:8px;margin:14px 0;font-size:.95rem}
.note.warn{background:var(--warn-bg);color:var(--warn-ink)}
.err{color:var(--danger);min-height:1.5em;margin:8px 0}

.btn{font:inherit;min-height:44px;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.92rem}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.6;cursor:wait}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.link{background:none;border:0;padding:4px;font:inherit;color:var(--muted);text-decoration:underline;cursor:pointer}

label{display:block;font-weight:600;margin-bottom:6px}
.ask input{width:100%;font-family:var(--mono);font-size:1rem;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.ask{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:8px}
.lbl{font-weight:600;margin:0 0 8px}
.wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}
@media (min-width:520px){.wgrid{grid-template-columns:repeat(4,1fr)}}
.wbox{display:flex;align-items:center;gap:6px;margin:0;padding:0 10px;font-weight:400;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.wbox:focus-within{outline:3px solid var(--accent);outline-offset:1px}
.wbox .n{color:var(--muted);font-size:.8rem;min-width:1.2em}
.wbox input{border:0;outline:0;background:transparent;color:var(--ink);width:100%;min-width:0;padding:12px 0;font-family:var(--mono);font-size:1.05rem;font-weight:600}

.words{list-style:none;padding:0;margin:16px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.words li{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);display:flex;align-items:baseline;gap:8px}
.words .n{color:var(--muted);font-size:.8rem;min-width:1.2em}
.words .w{font-family:var(--mono);font-weight:600;font-size:1.05rem}

.sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0 10px}
.sec-head h2{margin:0}
.tools{display:grid;gap:10px;margin-bottom:8px}
.toolrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
#q{width:100%;font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.9rem;min-height:36px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
#selbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--panel);color:var(--panel-ink);margin:8px 0}
#selbar[hidden]{display:none}
#selbar .spacer{flex:1;min-width:8px}

.row{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.row .chk{margin:0;padding:4px;display:flex}
.row .info{min-width:0}
.name{font-weight:600;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:.88rem}
.row .size{color:var(--muted);font-size:.9rem}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.row .acts{grid-column:2/-1}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.empty{padding:20px 0;color:var(--muted)}

#list.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.thumb{aspect-ratio:4/3;background:var(--bg) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700;font-family:var(--mono);font-size:1.1rem}
.card .chk{position:absolute;top:6px;left:6px;margin:0;padding:4px;background:var(--surface);border-radius:6px;display:flex}
.cbody{padding:8px 10px 10px}
.card .name{font-size:.92rem}

#status{min-height:1.5em;color:var(--muted);font-size:.92rem;margin:6px 0}
#status.bad{color:var(--danger)}
#status.good{color:var(--ok)}

details{margin-top:20px;border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:600;padding:6px 0}
.blk{display:grid;grid-template-columns:3.2em 1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem}
.blk .t{color:var(--muted);grid-column:2}
.blk .h{font-family:var(--mono);color:var(--muted);grid-row:1;grid-column:3}
.blk .bad{color:var(--danger);font-weight:600}
.foot{color:var(--muted);font-size:.88rem;margin-top:24px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:12px;z-index:10}
.modal[hidden]{display:none}
.modal-card{background:var(--surface);border-radius:12px;max-width:960px;width:100%;max-height:100%;overflow:auto;padding:12px}
.modal-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.modal-bar span{font-weight:600;overflow-wrap:anywhere}
#mBody img,#mBody video{max-width:100%;max-height:70vh;display:block;margin:0 auto}
#mBody audio{width:100%}
#mBody iframe{width:100%;height:70vh;border:0;background:#fff}
@media (prefers-reduced-motion:reduce){.code.flash,main.enter{animation:none}}
</style>
</head>
<body>
<main id="app"></main>
<div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-label="Pratinjau file">
  <div class="modal-card">
    <div class="modal-bar"><span id="mTitle"></span><button id="mClose" class="btn sm" type="button">Tutup</button></div>
    <div id="mBody"></div>
  </div>
</div>

<script>
'use strict';
/* ====== Pengaturan ====== */
const CH = 4 * 1024 * 1024;        // ukuran potongan file terenkripsi
const IDLE_MS = 3 * 60 * 1000;     // kunci otomatis bila tidak aktif
const AWAY_MS = 2 * 60 * 1000;     // kunci otomatis bila halaman ditinggal
const ITER = 600000;               // putaran PBKDF2 (memperlambat tebak-tebakan)
const MB = 1024 * 1024;

/* ====== Util ====== */
const $ = s => document.querySelector(s);
const enc = new TextEncoder(), dec = new TextDecoder();
const toHex = b => Array.from(new Uint8Array(b), x => x.toString(16).padStart(2, '0')).join('');
const unhex = s => new Uint8Array(s.match(/../g).map(x => parseInt(x, 16)));
const rand = n => crypto.getRandomValues(new Uint8Array(n));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtSize = b => b < 1024 ? b + ' B' : b < MB ? (b / 1024).toFixed(1).replace('.', ',') + ' KB'
  : b < 1073741824 ? (b / MB).toFixed(1).replace('.', ',') + ' MB' : (b / 1073741824).toFixed(2).replace('.', ',') + ' GB';
const fmtDate = ts => new Date(ts).toLocaleString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
const fmtCode = h => h ? h.slice(0, 16).toUpperCase().match(/.{4}/g).join(' ') : '—';
function download(blob, name) {
  const u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 60000);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.append(ta); ta.select(); let ok = false;
    try { ok = document.execCommand('copy'); } catch (_) {}
    ta.remove(); return ok;
  }
}

/* ====== Penyimpanan (IndexedDB) ====== */
let db;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('brankas-rantai', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('meta', { keyPath: 'k' });
      d.createObjectStore('files', { keyPath: 'id' });
      d.createObjectStore('chunks', { keyPath: 'id' });
      d.createObjectStore('ledger', { keyPath: 'index' });
    };
    r.onsuccess = () => { db = r.result; res(); };
    r.onerror = () => rej(r.error);
  });
}
const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const store = (n, m = 'readonly') => db.transaction(n, m).objectStore(n);
const dbGet = (n, k) => req(store(n).get(k));
const dbPut = (n, v) => req(store(n, 'readwrite').put(v));
const dbDel = (n, k) => req(store(n, 'readwrite').delete(k));
const dbAll = n => req(store(n).getAll());
const dbClearAll = async () => { for (const n of ['meta', 'files', 'chunks', 'ledger']) await req(store(n, 'readwrite').clear()); };
const lastBlock = () => new Promise((res, rej) => {
  const r = store('ledger').openCursor(null, 'prev');
  r.onsuccess = () => res(r.result ? r.result.value : null);
  r.onerror = () => rej(r.error);
});

/* ====== Kriptografi ====== */
const sha256hex = async s => toHex(await crypto.subtle.digest('SHA-256', enc.encode(s)));
async function derive(phrase, salt) {
  const base = await crypto.subtle.importKey('raw', enc.encode(phrase), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' }, base, 512));
  return {
    aes: await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-GCM', false, ['encrypt', 'decrypt']),
    mac: await crypto.subtle.importKey('raw', bits.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign', 'verify'])
  };
}
async function encBytes(key, buf, aad) {
  const iv = rand(12);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: aad }, key, buf));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return out;
}
const decBytes = (key, data, aad) =>
  crypto.subtle.decrypt({ name: 'AES-GCM', iv: data.slice(0, 12), additionalData: aad }, key, data.slice(12));

/* ====== 12 kata ====== */
const CONS = 'bdfghjklmnprstvz', VOW = 'aeiou';           // 16 x 5 = 80 suku kata
const syl = i => CONS[Math.floor(i / 5)] + VOW[i % 5];
const WORD_RE = /^(?:[bdfghjklmnprstvz][aeiou]){2}$/;     // 80 x 80 = 6400 kata
function makeWord() {
  const N = 6400, lim = Math.floor(2 ** 32 / N) * N;
  let x; do { x = crypto.getRandomValues(new Uint32Array(1))[0]; } while (x >= lim);
  const i = x % N; return syl(i % 80) + syl(Math.floor(i / 80));
}
const normWords = s => s.toLowerCase().split(/[^a-z]+/).filter(Boolean);
const validWords = a => a.length === 12 && a.every(w => WORD_RE.test(w));

/* ====== Status ====== */
let keys = null, items = [], head = '', ledgerCount = 0, cfgExists = false, locking = false;
let setup = { words: null, ask: [] }, lockInfo = { fails: 0, unclean: false }, lockMsg = '';
let ui = { q: '', cat: 'semua', mode: 'list', sel: new Set() };
let chain = { ok: null }, lockAt = 0, lastView = '';
let thumbs = new Map(), thumbObs = null, thumbQ = Promise.resolve();
let restoreFile = null, restoreCfg = null;
let queue = Promise.resolve();

/* ====== Rantai blok ======
   Setiap kejadian (buka, tutup, tambah, hapus, lihat, simpan, cadangan, gagal masuk) menjadi satu blok.
   Hash blok = SHA-256(isi blok + hash blok sebelumnya). Blok yang dibuat saat brankas terbuka
   juga diberi tanda tangan HMAC dari kunci 12 kata, jadi hanya pemilik 12 kata yang bisa membuatnya. */
function addBlock(event, detail = '') {
  queue = queue.then(async () => {
    const last = await lastBlock();
    const index = last ? last.index + 1 : 0, prev = last ? last.hash : '0', ts = Date.now();
    const hash = await sha256hex([index, ts, event, detail, prev].join('|'));
    const mac = keys ? toHex(await crypto.subtle.sign('HMAC', keys.mac, enc.encode(hash))) : null;
    await dbPut('ledger', { index, ts, event, detail, prev, hash, mac });
    head = hash; ledgerCount = index + 1; paintCode();
    if ($('#ledger')) paintLedger().catch(() => {});
  }).catch(e => console.error(e));
  return queue;
}
function paintCode() {
  const el = $('#code'); if (!el) return;
  const t = fmtCode(head);
  if (el.textContent !== t) { el.textContent = t; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
}
async function verifyChain() {
  const blocks = (await dbAll('ledger')).sort((a, b) => a.index - b.index);
  const problems = []; let prev = '0';
  for (let i = 0; i < blocks.length; i++) {
    const b = blocks[i];
    if (b.index !== i) problems.push('Blok #' + i + ' hilang');
    if (b.prev !== prev) problems.push('Blok #' + b.index + ': sambungan ke blok sebelumnya putus');
    if (await sha256hex([b.index, b.ts, b.event, b.detail, b.prev].join('|')) !== b.hash) problems.push('Blok #' + b.index + ': isi diubah');
    if (b.mac) {
      if (!await crypto.subtle.verify('HMAC', keys.mac, unhex(b.mac), enc.encode(b.hash))) problems.push('Blok #' + b.index + ': tanda tangan palsu');
    } else if (b.event !== 'gagal') problems.push('Blok #' + b.index + ': tidak bertanda tangan');
    prev = b.hash;
  }
  return { n: blocks.length, problems };
}
async function runVerify() {
  const r = await verifyChain();
  chain = r.problems.length ? { ok: false, n: r.n, msg: r.problems.join('; ') } : { ok: true, n: r.n };
  paintBadge(); return r;
}
function paintBadge() {
  const b = $('#badge'); if (!b) return;
  const s = chain.ok === null ? ['idle', 'Rantai belum diperiksa'] : chain.ok ? ['ok', '✓ Rantai valid dan aman'] : ['bad', '! Ada masalah pada rantai'];
  b.className = 'badge ' + s[0]; b.textContent = s[1];
}
async function refreshLockInfo() {
  const all = (await dbAll('ledger')).sort((a, b) => a.index - b.index);
  ledgerCount = all.length; head = all.length ? all[all.length - 1].hash : '';
  let fails = 0, i = all.length - 1;
  while (i >= 0 && all[i].event === 'gagal') { fails++; i--; }
  lockInfo = { fails, unclean: i >= 0 && all[i].event !== 'tutup' };
}

/* ====== Alur brankas ====== */
async function createVault(words) {
  const salt = rand(16);
  const k = await derive(words.join(' '), salt);
  const check = await encBytes(k.aes, enc.encode('BRANKAS-OK'), enc.encode('check'));
  await dbPut('meta', { k: 'cfg', salt, check });
  cfgExists = true; keys = k; setup = { words: null, ask: [] };
  await addBlock('buat'); await addBlock('buka');
  items = []; chain = { ok: null };
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  bump(); render();
}
async function unlock(arr) {
  const cfg = await dbGet('meta', 'cfg');
  const k = await derive(arr.join(' '), cfg.salt);
  try {
    if (dec.decode(await decBytes(k.aes, cfg.check, enc.encode('check'))) !== 'BRANKAS-OK') throw 0;
  } catch (e) { await addBlock('gagal'); return false; }
  keys = k; chain = { ok: null }; await addBlock('buka'); await loadItems(); return true;
}
async function lock(reason = '') {
  if (!keys || locking) return;
  locking = true; closeModal();
  try {
    await addBlock('tutup', reason);
    keys = null; items = []; ui.sel.clear(); thumbs.clear(); chain = { ok: null };
    await refreshLockInfo(); lockMsg = ''; await render();
  } finally { locking = false; }
}
async function loadItems() {
  const out = [];
  for (const f of await dbAll('files')) {
    try {
      const m = JSON.parse(dec.decode(await decBytes(keys.aes, f.d, enc.encode('meta:' + f.id))));
      out.push({ id: f.id, ...m });
    } catch (e) { out.push({ id: f.id, name: '(file rusak)', type: '', size: 0, ts: 0, n: 0, bad: true }); }
  }
  items = out.sort((a, b) => b.ts - a.ts);
}
async function addFiles(list) {
  for (const f of list) {
    const id = toHex(rand(6)), n = Math.max(1, Math.ceil(f.size / CH));
    for (let i = 0; i < n; i++) {
      const buf = await f.slice(i * CH, (i + 1) * CH).arrayBuffer();
      const cid = id + ':' + i;
      await dbPut('chunks', { id: cid, d: await encBytes(keys.aes, buf, enc.encode(cid)) });
      setStatus('Mengenkripsi ' + f.name + ' ' + Math.round((i + 1) / n * 100) + '%');
    }
    const meta = { name: f.name, type: f.type || '', size: f.size, ts: Date.now(), n };
    await dbPut('files', { id, d: await encBytes(keys.aes, enc.encode(JSON.stringify(meta)), enc.encode('meta:' + id)) });
    await addBlock('tambah', id);
  }
  await loadItems(); paintList();
  setStatus(list.length + ' file disimpan dan dienkripsi.', 'good');
}
async function readFile(it) {
  const parts = [];
  for (let i = 0; i < it.n; i++) {
    const cid = it.id + ':' + i, c = await dbGet('chunks', cid);
    parts.push(await decBytes(keys.aes, c.d, enc.encode(cid)));
  }
  return new Blob(parts, { type: it.type });
}
async function deleteFile(it) {
  for (let i = 0; i < it.n; i++) await dbDel('chunks', it.id + ':' + i);
  await dbDel('files', it.id); thumbs.delete(it.id); ui.sel.delete(it.id);
  await addBlock('hapus', it.id);
}
async function resetVault() {
  if (prompt('Semua file di brankas ini akan terhapus permanen. Ketik HAPUS untuk melanjutkan.') !== 'HAPUS') return;
  await dbClearAll(); location.reload();
}

/* ====== Cadangan terenkripsi ======
   Berkas .brankas berisi: kunci turunan (salt), riwayat rantai (dienkripsi lagi dengan kunci 12 kata),
   nama/tipe file (sudah terenkripsi), dan potongan isi file (sudah terenkripsi). Tanpa 12 kata, isinya tak terbaca. */
const MAGIC = enc.encode('BRANKAS-CADANGAN-1\n');
async function makeBackup() {
  setStatus('Menyiapkan cadangan…');
  await addBlock('cadangan');
  const parts = [MAGIC];
  const rec = (type, key, data) => {
    const k = enc.encode(key), h = new DataView(new ArrayBuffer(7));
    h.setUint8(0, type.charCodeAt(0)); h.setUint16(1, k.length, true); h.setUint32(3, data.byteLength, true);
    parts.push(h.buffer, k, data);
  };
  const cfg = await dbGet('meta', 'cfg');
  rec('C', '', enc.encode(JSON.stringify({ salt: toHex(cfg.salt), check: toHex(cfg.check) })));
  const ledger = (await dbAll('ledger')).sort((a, b) => a.index - b.index);
  rec('L', '', await encBytes(keys.aes, enc.encode(JSON.stringify(ledger)), enc.encode('ledger-backup')));
  for (const f of await dbAll('files')) rec('F', f.id, f.d);
  for (const c of await dbAll('chunks')) rec('K', c.id, c.d);
  const d = new Date(), ymd = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
  const blob = new Blob(parts, { type: 'application/octet-stream' });
  download(blob, 'brankas-cadangan-' + ymd + '.brankas');
  setStatus('Cadangan terenkripsi disimpan (' + fmtSize(blob.size) + '). Simpan di tempat lain; hanya 12 kata yang bisa membukanya.', 'good');
}
async function* readEntries(file, start) {
  let o = start;
  while (o < file.size) {
    if (o + 7 > file.size) throw new Error('rusak');
    const h = new DataView(await file.slice(o, o + 7).arrayBuffer());
    const type = String.fromCharCode(h.getUint8(0)), kl = h.getUint16(1, true), dl = h.getUint32(3, true);
    o += 7;
    if (o + kl + dl > file.size) throw new Error('rusak');
    const key = dec.decode(await file.slice(o, o + kl).arrayBuffer()); o += kl;
    const d = new Uint8Array(await file.slice(o, o + dl).arrayBuffer()); o += dl;
    yield { type, key, d };
  }
}
async function startRestore(file) {
  try {
    const hd = new Uint8Array(await file.slice(0, MAGIC.length).arrayBuffer());
    if (hd.length !== MAGIC.length || hd.some((b, i) => b !== MAGIC[i])) throw new Error('bukan cadangan');
    const first = await readEntries(file, MAGIC.length).next();
    if (first.done || first.value.type !== 'C') throw new Error('rusak');
    const c = JSON.parse(dec.decode(first.value.d));
    restoreCfg = { salt: unhex(c.salt), check: unhex(c.check) }; restoreFile = file;
    viewRestore();
  } catch (e) {
    const el = $('#rerr'); if (el) el.textContent = 'Berkas ini bukan cadangan brankas yang valid.';
  }
}
async function doRestore(k) {
  const it = readEntries(restoreFile, MAGIC.length);
  await it.next();                                           // lewati entri cfg
  const second = await it.next();
  if (second.done || second.value.type !== 'L') throw new Error('rusak');
  const ledger = JSON.parse(dec.decode(await decBytes(k.aes, second.value.d, enc.encode('ledger-backup'))));
  await dbClearAll();
  await dbPut('meta', { k: 'cfg', salt: restoreCfg.salt, check: restoreCfg.check });
  for (const b of ledger) await dbPut('ledger', b);
  for await (const e of it) {
    if (e.type === 'F') await dbPut('files', { id: e.key, d: e.d });
    else if (e.type === 'K') await dbPut('chunks', { id: e.key, d: e.d });
  }
  cfgExists = true; keys = k; restoreFile = null; restoreCfg = null; thumbs.clear(); ui.sel.clear(); chain = { ok: null };
  await refreshLockInfo(); await addBlock('pulih'); await loadItems(); bump(); await render();
}

/* ====== ZIP sederhana (tanpa kompresi) untuk simpan banyak file sekaligus ====== */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = u8 => { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
async function makeZip(list) {
  const parts = [], central = []; let off = 0;
  const dt = new Date(), time = (dt.getHours() << 11) | (dt.getMinutes() << 5) | (dt.getSeconds() >> 1),
    date = ((dt.getFullYear() - 1980) << 9) | ((dt.getMonth() + 1) << 5) | dt.getDate();
  for (const f of list) {
    const data = new Uint8Array(await f.blob.arrayBuffer()), name = enc.encode(f.name), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, time, true); lh.setUint16(12, date, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true);
    parts.push(lh.buffer, name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(12, time, true); ch.setUint16(14, date, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
    ch.setUint32(42, off, true);
    central.push(ch.buffer, name);
    off += 30 + name.length + data.length;
  }
  let cs = 0; for (const c of central) cs += c.byteLength;
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, list.length, true); end.setUint16(10, list.length, true);
  end.setUint32(12, cs, true); end.setUint32(16, off, true);
  return new Blob([...parts, ...central, end.buffer], { type: 'application/zip' });
}
function uniqName(name, used) {
  let n = name, i = 2;
  while (used.has(n)) { const d = name.lastIndexOf('.'); n = d > 0 ? name.slice(0, d) + ' (' + i + ')' + name.slice(d) : name + ' (' + i + ')'; i++; }
  used.add(n); return n;
}

/* ====== Kunci otomatis ====== */
let hiddenAt = 0;
function bump() { lockAt = Date.now() + IDLE_MS; }
['pointerdown', 'keydown', 'scroll'].forEach(e => addEventListener(e, () => { if (keys) bump(); }, { passive: true }));
document.addEventListener('visibilitychange', () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (keys && hiddenAt && Date.now() - hiddenAt > AWAY_MS) lock('otomatis');
});
addEventListener('pagehide', () => { if (keys) addBlock('tutup', 'keluar'); });
setInterval(() => {
  if (!keys) return;
  const s = Math.max(0, Math.ceil((lockAt - Date.now()) / 1000)), el = $('#cd');
  if (el) el.textContent = 'Terkunci otomatis dalam ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') + ' bila tidak ada aktivitas.';
  if (s <= 0) lock('otomatis');
}, 1000);

/* ====== Kategori file ====== */
const CATS = [['semua', 'Semua'], ['dokumen', 'Dokumen'], ['gambar', 'Gambar'], ['video', 'Video'], ['audio', 'Audio'], ['lain', 'Lainnya']];
const extOf = n => (n.includes('.') ? n.split('.').pop() : '').toLowerCase();
function category(it) {
  const t = it.type || '', e = extOf(it.name);
  if (t.startsWith('image/') || /^(jpe?g|png|gif|webp|bmp|svg|heic|avif)$/.test(e)) return 'gambar';
  if (t.startsWith('video/') || /^(mp4|mov|mkv|webm|avi|m4v|3gp)$/.test(e)) return 'video';
  if (t.startsWith('audio/') || /^(mp3|wav|m4a|ogg|flac|aac)$/.test(e)) return 'audio';
  if (t === 'application/pdf' || t.startsWith('text/') || /officedocument|msword|ms-excel|ms-powerpoint|opendocument/.test(t) ||
      /^(pdf|docx?|xlsx?|pptx?|txt|csv|odt|ods|odp|rtf|md)$/.test(e)) return 'dokumen';
  return 'lain';
}
const canPreview = it => ['gambar', 'video', 'audio'].includes(category(it)) || it.type === 'application/pdf';
const visible = () => items.filter(it => (ui.cat === 'semua' || category(it) === ui.cat) && (!ui.q || it.name.toLowerCase().includes(ui.q.toLowerCase())));

function boxesHTML() {
  return `<p class="lbl" id="wlabel">Masukkan 12 kata, satu kata per kotak</p>
  <div class="wgrid" id="wgrid" role="group" aria-labelledby="wlabel">${Array.from({ length: 12 }, (_, i) => `<label class="wbox"><span class="n">${i + 1}</span><input maxlength="4" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Kata ${i + 1}"></label>`).join('')}</div>`;
}
function wireBoxes(submit) {
  const boxes = [...document.querySelectorAll('#wgrid input')];
  const fill = (start, list) => {
    list.forEach((w, j) => { if (boxes[start + j]) boxes[start + j].value = w.slice(0, 4); });
    boxes[Math.min(start + list.length, 11)].focus();
  };
  boxes.forEach((el, i) => {
    el.addEventListener('paste', e => {                       // tempel 12 kata sekaligus
      const l = normWords(e.clipboardData.getData('text'));
      if (l.length > 1) { e.preventDefault(); fill(i, l); }
    });
    el.addEventListener('input', () => {
      el.value = el.value.toLowerCase();
      if (/[^a-z]/.test(el.value)) { const l = normWords(el.value); el.value = ''; if (l.length) fill(i, l); }
      else if (el.value.length >= 4 && i < 11) boxes[i + 1].focus();
    });
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); if (i === 11) submit(); else boxes[i + 1].focus(); }
      else if (e.key === 'Backspace' && !el.value && i > 0) boxes[i - 1].focus();
    });
  });

}
function wireRestore() {
  const b = $('#rbtn'), p = $('#rpick'); if (!b) return;
  b.onclick = () => p.click();
  p.onchange = async () => { const f = p.files[0]; p.value = ''; if (f) await startRestore(f); };
}

}

}

function viewSetup() {
  const w = setup.words;
  $('#app').innerHTML = `
  <header class="top"><div class="brand">Brankas rantai</div></header>
  <section class="panel">
    <h1>Buat brankas baru</h1>
    <p>Dokumen, foto, dan video Anda dienkripsi di perangkat ini. Kuncinya adalah 12 kata yang dibuat sekarang.</p>
    ${!w ? '<button id="gen" class="btn primary" type="button">Buat 12 kata</button>' : `
    <ol class="words">${w.map((x, i) => `<li><span class="n">${i + 1}</span><span class="w">${x}</span></li>`).join('')}</ol>
    <div class="note warn"><strong>Tulis 12 kata ini di kertas sekarang.</strong> Jangan difoto atau disimpan di HP. Tanpa 12 kata ini file tidak bisa dibuka siapa pun, termasuk Anda, dan tidak bisa dipulihkan.</div>
    <p>Untuk memastikan sudah tertulis, ketik kata nomor ${setup.ask.map(i => i + 1).join(', ')}:</p>
    <div class="ask">${setup.ask.map(i => `<div><label for="a${i}">Kata ${i + 1}</label><input id="a${i}" data-i="${i}" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"></div>`).join('')}</div>
    <p id="err" class="err" role="alert"></p>
    <button id="make" class="btn primary" type="button">Buat brankas</button>`}
  </section>${RESTORE_HTML}${FOOT}`;
  enter('setup'); wireRestore();
  const gen = $('#gen');
  if (gen) gen.onclick = () => {
    setup.words = Array.from({ length: 12 }, makeWord);
    const pool = [...Array(12).keys()], ask = [];
    while (ask.length < 3) ask.push(pool.splice(crypto.getRandomValues(new Uint32Array(1))[0] % pool.length, 1)[0]);
    setup.ask = ask.sort((a, b) => a - b); viewSetup();
  };
  const make = $('#make');
  if (make) make.onclick = async () => {
    const ok = [...document.querySelectorAll('.ask input')].every(el => el.value.trim().toLowerCase() === setup.words[+el.dataset.i]);
    if (!ok) { $('#err').textContent = 'Kata tidak cocok. Periksa lagi catatan Anda.'; return; }
    make.disabled = true; make.textContent = 'Membuat brankas…';
    await createVault(setup.words);
  };
}

/* ====== Gambar mini untuk tampilan kartu (dibuat di memori, hilang saat dikunci) ====== */
function drawThumb(src, w, h) {
  if (!w || !h) return null;
  const s = Math.min(1, 320 / Math.max(w, h)), c = document.createElement('canvas');
  c.width = Math.round(w * s); c.height = Math.round(h * s);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.7);
}
async function makeThumb(it) {
  if (thumbs.has(it.id)) return thumbs.get(it.id);
  let url = null; const cat = category(it);
  try {
    if (cat === 'gambar' && it.size <= 20 * MB) {
      const bmp = await createImageBitmap(await readFile(it)); url = drawThumb(bmp, bmp.width, bmp.height); bmp.close && bmp.close();
    } else if (cat === 'video' && it.size <= 60 * MB) {
      const u = URL.createObjectURL(await readFile(it)), v = document.createElement('video');
      v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = u;
      await new Promise((res, rej) => { v.onloadeddata = res; v.onerror = rej; setTimeout(rej, 8000); });
      v.currentTime = Math.min(1, (v.duration || 1) / 2);
      await new Promise(res => { v.onseeked = res; setTimeout(res, 3000); });
      url = drawThumb(v, v.videoWidth, v.videoHeight); URL.revokeObjectURL(u);
    }
  } catch (e) { url = null; }
  thumbs.set(it.id, url); return url;
}
const setThumb = (el, u) => { el.style.backgroundImage = 'url(' + u + ')'; el.textContent = ''; };
function observeThumbs() {
  if (thumbObs) thumbObs.disconnect();
  thumbObs = new IntersectionObserver(es => {
    for (const e of es) {
      if (!e.isIntersecting) continue;
      thumbObs.unobserve(e.target); const el = e.target;
      thumbQ = thumbQ.then(async () => {
        if (!keys) return;
        const it = items.find(x => x.id === el.dataset.id); if (!it) return;
        const u = await makeThumb(it); if (u && document.contains(el)) setThumb(el, u);
      });
    }
  }, { rootMargin: '200px' });
  document.querySelectorAll('.thumb').forEach(el => {
    const u = thumbs.get(el.dataset.id);
    if (u) setThumb(el, u); else if (el.dataset.cat === 'gambar' || el.dataset.cat === 'video') thumbObs.observe(el);
  });
}

/* ====== Layar utama ====== */
function viewMain() {
  $('#app').innerHTML = `
  <header class="top"><div class="brand">Brankas rantai</div><button id="lock" class="btn" type="button">Kunci dan keluar</button></header>
  <section class="hero">
    <div class="herotop"><p class="label">Kode rantai saat ini</p><span id="badge" class="badge idle" role="status"></span></div>
    <div class="coderow"><div id="code" class="code">${fmtCode(head)}</div><button id="copy" class="btn sm" type="button">Salin kode</button></div>
    <p class="hint">Berubah setiap brankas dibuka, ditutup, atau file ditambah dan dilihat. Catat kode yang muncul setelah Anda mengunci, lalu cocokkan saat kembali.</p>
    <p class="hint" id="cd"></p>
  </section>
  <div class="sec-head"><h2>Isi brankas (<span id="count"></span>)</h2>
    <div class="btnrow"><input id="pick" type="file" multiple hidden><button id="add" class="btn primary" type="button">Tambah file</button><button id="backup" class="btn" type="button">Cadangkan</button></div></div>
  <div class="tools">
    <input id="q" type="search" placeholder="Cari nama file" aria-label="Cari nama file" autocomplete="off">
    <div class="toolrow">
      <div class="chips" role="group" aria-label="Filter jenis file">${CATS.map(([k, l]) => `<button class="chip" data-cat="${k}" type="button">${l}</button>`).join('')}</div>
      <div class="chips" role="group" aria-label="Tampilan"><button class="chip" data-mode="list" type="button">Daftar</button><button class="chip" data-mode="grid" type="button">Kartu</button></div>
    </div>
  </div>
  <div id="selbar" hidden><strong id="selcount"></strong><span class="spacer"></span>
    <button id="selAll" class="btn sm" type="button">Pilih semua yang tampil</button>
    <button id="selSave" class="btn sm" type="button">Simpan keluar</button>
    <button id="selDel" class="btn sm danger" type="button">Hapus</button>
    <button id="selClear" class="btn sm" type="button">Batal pilih</button></div>
  <div id="status" role="status"></div>
  <div id="list"></div>
  <details>
    <summary>Riwayat rantai (<span id="lcount"></span> blok)</summary>
    <p><button id="verify" class="btn sm" type="button">Periksa keutuhan rantai</button></p>
    <div id="ledger"></div>
  </details>${FOOT}`;
  enter('main'); wireCopy(); paintBadge(); syncControls(); paintList(); paintLedger();
  $('#lock').onclick = () => lock();
  const pick = $('#pick');
  $('#add').onclick = () => pick.click();
  pick.onchange = async () => { if (pick.files.length) { const l = [...pick.files]; pick.value = ''; try { await addFiles(l); } catch (e) { setStatus('Gagal menyimpan: ' + e.message, 'bad'); } } };
  $('#backup').onclick = () => makeBackup().catch(e => setStatus('Gagal membuat cadangan: ' + e.message, 'bad'));
  const q = $('#q'); q.value = ui.q; q.oninput = () => { ui.q = q.value; paintList(); };
  document.querySelectorAll('.chip[data-cat]').forEach(b => b.onclick = () => { ui.cat = b.dataset.cat; syncControls(); paintList(); });
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { ui.mode = b.dataset.mode; syncControls(); paintList(); });
  $('#verify').onclick = async () => {
    const r = await runVerify();
    setStatus(r.problems.length ? 'Rantai bermasalah: ' + r.problems.join('; ') : 'Rantai utuh: ' + r.n + ' blok, semua sah.', r.problems.length ? 'bad' : 'good');
    $('#status').scrollIntoView({ block: 'center' });
  };
  $('#list').onchange = e => {
    const id = e.target.dataset && e.target.dataset.sel; if (!id) return;
    e.target.checked ? ui.sel.add(id) : ui.sel.delete(id); paintSel();
  };
  $('#list').onclick = async e => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const it = items.find(x => x.id === b.dataset.id); if (!it) return;
    if (b.dataset.act === 'del') {
      if (confirm('Hapus "' + it.name + '" secara permanen?')) { await deleteFile(it); await loadItems(); paintList(); }
      return;
    }
    setStatus('Mendekripsi…');
    try {
      const blob = await readFile(it);
      if (b.dataset.act === 'save') { download(blob, it.name); await addBlock('ekspor', it.id); }
      else { showModal(it, blob); await addBlock('lihat', it.id); }
      setStatus('');
    } catch (err) { setStatus('Gagal membuka file: data rusak atau sudah diubah pihak lain.', 'bad'); }
  };
  $('#selAll').onclick = () => { visible().forEach(it => ui.sel.add(it.id)); paintList(); };
  $('#selClear').onclick = () => { ui.sel.clear(); paintList(); };
  $('#selDel').onclick = async () => {
    const its = items.filter(i => ui.sel.has(i.id)); if (!its.length) return;
    if (!confirm(its.length + ' file akan dihapus permanen dari brankas. Lanjutkan?')) return;
    for (const it of its) await deleteFile(it);
    await loadItems(); paintList(); setStatus(its.length + ' file dihapus.', 'good');
  };
  $('#selSave').onclick = async () => {
    const its = items.filter(i => ui.sel.has(i.id) && !i.bad); if (!its.length) return;
    if (!confirm(its.length + ' file akan disimpan keluar dari brankas dan tidak lagi terenkripsi. Lanjutkan?')) return;
    setStatus('Mendekripsi ' + its.length + ' file…');
    try {
      if (its.length === 1) download(await readFile(its[0]), its[0].name);
      else {
        const used = new Set(), files = [];
        for (const it of its) files.push({ name: uniqName(it.name, used), blob: await readFile(it) });
        download(await makeZip(files), 'brankas-terpilih.zip');
      }
      for (const it of its) await addBlock('ekspor', it.id);
      setStatus(its.length + ' file disimpan keluar.', 'good');
    } catch (err) { setStatus('Gagal menyimpan: data rusak atau sudah diubah pihak lain.', 'bad'); }
  };
  if (chain.ok === null) runVerify().then(r => { if (r.problems.length) setStatus('Rantai bermasalah: ' + r.problems.join('; '), 'bad'); });
}

/* ====== Pratinjau ====== */
let modalURL = null;
function showModal(it, blob) {
  closeModal();
  modalURL = URL.createObjectURL(blob);
  const c = category(it);
  $('#mTitle').textContent = it.name;
  $('#mBody').innerHTML = c === 'gambar' ? `<img src="${modalURL}" alt="">`
    : c === 'video' ? `<video src="${modalURL}" controls playsinline></video>`
    : c === 'audio' ? `<audio src="${modalURL}" controls></audio>`
    : `<iframe src="${modalURL}" title="Pratinjau"></iframe>`;
  $('#modal').hidden = false;
}
function closeModal() {
  $('#modal').hidden = true; $('#mBody').innerHTML = '';
  if (modalURL) { URL.revokeObjectURL(modalURL); modalURL = null; }
}
$('#mClose').onclick = closeModal;
addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ====== Mulai ====== */
(async () => {
  try {
    if (!window.crypto || !crypto.subtle) throw new Error('crypto');
    await openDB();
    cfgExists = !!(await dbGet('meta', 'cfg'));
    await refreshLockInfo();
    render();
  } catch (e) {
    $('#app').innerHTML = '<section class="panel"><h1>Browser tidak didukung</h1><p>Brankas butuh penyimpanan lokal dan enkripsi bawaan browser. Buka file ini di Chrome, Edge, Firefox, atau Safari versi terbaru, dan jangan gunakan mode penyamaran.</p></section>';
  }
})();
